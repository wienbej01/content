  deliverable: Standalone, retry-wrapped CLI scripts - ElevenLabs TTS (locked James Harrington voice),
    image generation (Higgsfield Soul ID / Flux for persona consistency), and image+audio lipsync (Higgsfield
    CLI with Sync.so/HeyGen fallback) - chained script.json -> audio -> images -> lipsync -> assemble_video.py
    -> Telegram (Gate B).
  est_hours: 10
  how: Assistant writes each stage as an independent testable script with polling/backoff for async video
    jobs; user supplies API keys in gitignored runtime.env. Pin @higgsfield/cli version.
  acceptance: From an approved script, the chain produces a finished branded video and delivers it to
    Telegram for endorsement with no manual web-tool interaction.
  notes: 'Build order step 2. Lipsync is the dominant cost + most likely to need retries (CLI is v0.1.x).
    Keep a provider-agnostic interface so the lipsync backend is swappable.

    [2026-06-08 21:37 +0800] M2 TTS-to-Manifest implemented: scripts/tts.py, scripts/sample_script.json,
    scripts/TTS_README.md, tests/test_tts.py (8/8 pass). Pipeline: script.json → ElevenLabs TTS → narration/
    → manifest.json → assemble.py. Validated --validate-only, caching, error handling. Live TTS test blocked
    by missing ELEVENLABS_API_KEY in runtime.env — to be tested on first real production run.

    [2026-06-08 21:58 +0800] M2 TTS-to-Manifest LIVE VALIDATED. scripts/tts.py + tests (8/8). Full pipeline:
    script.json → ElevenLabs → narration/ → manifest.json → assemble.py → 16x9+9x16 MP4s. Caching (no
    re-spend), --force, --validate-only, --assemble all working. Remaining: image generation + lipsync
    automation (Higgsfield CLI chain).

    [2026-06-08 22:09 +0800] M2-B FIXED: Lipsync regression identified and resolved. Root cause: tts.py
    was adding an ''audio'' field to lipsync clip segments, causing assemble.py to replace the baked-in
    lipsync audio with freshly-generated TTS (different timing/duration). Fix: probe each media file;
    only add ''audio'' to manifest when media has no audio stream (images, B-roll). Regression test added.
    9/9 TTS tests + 7/7 assembly tests pass.'
