[pytest]
# Sprint 0 (S0-T03): test taxonomy + reliability config.
# Per-test timeout prevents a hung subprocess (e.g. cross-correlation, repair
# scripts) from stalling the whole suite indefinitely. Slow media/E2E tests may
# opt out via @pytest.mark.slow (given a generous timeout).
timeout = 300
timeout_method = thread

markers =
    slow: long-running media/E2E tests (extended timeout)
    real_provider: tests that call paid providers (gated, never run by default)

# Named test directories mirror the required taxonomy. Tests that still live at
# the tests/ root are collected too until they are reclassified.
testpaths =
    tests
