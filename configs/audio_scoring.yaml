    energy_level: 0.8
    reference_style: "peak energy, thesis delivery"
  4:
    tempo_bpm: 100
    instrumentation: "strings, piano, ambient pads"
    energy_level: 0.6
    reference_style: "resolution, analysis"
  5:
    tempo_bpm: 95
    instrumentation: "piano, soft pads, light percussion"
    energy_level: 0.4
    reference_style: "calm reflection"
  6:
    tempo_bpm: 85
    instrumentation: "solo piano, ambient reverb"
