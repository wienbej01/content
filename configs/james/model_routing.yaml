# Model Routing Configuration — James Harrington Production Flow
# Approved allocation: 2026-06-09
# Resolved from: `node node_modules/@higgsfield/cli/bin/higgsfield.js model list --json`

narration:
  provider: elevenlabs
  model: eleven_v3
  voice_env_var: ELEVENLABS_VOICE_ID
  lock_audio: true
  regenerate_after_lipsync: false

# Approved reference frames for hero_lipsync beats (fixes reference-frame monotony,
# Fable G14). Seedance composition FOLLOWS the reference image, so prompt-text angle
# changes alone do not materialize — the angle must come from the reference FRAME.
# The compiler rotates hero_lipsync beats across the `default_set` (round-robin, no
# two consecutive hero beats reuse the same frame), and honors a beat's explicit
# camera_angle_id when it matches a frame's `angle`.
#
# CONTINUITY RULE: all frames used within ONE episode must share wardrobe + setting
# (James cannot change clothes between cuts). Each set below is a single wardrobe in a
# single setting. `active_set` selects which set this production uses.
lipsync_references:
  # Brand-default wardrobe (navy sweater / white Oxford, BRAND_SPEC §3). 4 angles:
  # front + front_speaking + three_quarter + side_profile, all in the library setting.
  active_set: navy_sweater_library
  visual_chapters:
    mode: chapter
    chapters:
      1: { set: navy_sweater_library, allowed_angles: [front, front_speaking] }
      2: { set: navy_sweater_library, allowed_angles: [three_quarter, side_profile] }
      3: { set: dark_jacket_library, allowed_angles: [front, three_quarter] }
      4: { set: dark_jacket_library, allowed_angles: [side_profile, medium_wide] }
      5: { set: navy_sweater_library, allowed_angles: [front_speaking, three_quarter] }
      6: { set: navy_sweater_library, allowed_angles: [front] }
  sets:
    dark_jacket_library:
      wardrobe: "navy blazer over white open-collar shirt"
      setting: "home library, anglepoise lamp, bookshelves, framed print"
      frames:
        - {angle: front,          path: assets/reference/james/canonical/JAMES_MEDIUM_FRONT_DARK_JACKET_002.png}
        - {angle: medium_wide,    path: assets/reference/james/canonical/JAMES_MEDIUM_WIDE_DARK_JACKET_002.png}
        - {angle: three_quarter,  path: assets/reference/james/canonical/JAMES_THREE_QUARTER_DARK_JACKET_SPEAKING_002.png}
        - {angle: side_profile,   path: assets/reference/james/canonical/JAMES_SIDE_PROFILE_DARK_JACKET_SPEAKING_002.png}
    navy_sweater_library:
      wardrobe: "navy fine-knit sweater over white/pale-blue open-collar Oxford shirt"
      setting: "home library, brass anglepoise lamp at left, white bookshelves, framed print, soft window light"
      frames:
        - {angle: front,          path: assets/reference/james/canonical/JAMES_MEDIUM_FRONT_NAVY_SWEATER_002.png}
        - {angle: front_speaking, path: assets/reference/james/canonical/JAMES_MEDIUM_FRONT_NAVY_SWEATER_SPEAKING_002.png}
        - {angle: three_quarter,  path: assets/reference/james/canonical/JAMES_THREE_QUARTER_NAVY_SWEATER_002.png}
        - {angle: side_profile,   path: assets/reference/james/canonical/JAMES_SIDE_PROFILE_NAVY_SWEATER_002.png}

# Visual chapter mapping for act-based reference-frame rotation.
# Used when VISUAL_VARIATION_MODE=chapter. Each act maps to a reference-frame
# set + allowed_angles. Acts not listed fall back to active_set.
# Default VISUAL_VARIATION_MODE=flat preserves existing behavior.
visual_variation:
  mode: flat  # flat|chapter
  min_hero_frame_gap: 3
  max_visual_fatigue_score: 0.75
  chapters:
    1: {set: navy_sweater_library, allowed_angles: [front, front_speaking]}
    2: {set: navy_sweater_library, allowed_angles: [three_quarter, side_profile]}
    3: {set: dark_jacket_library,  allowed_angles: [front, three_quarter]}
    4: {set: dark_jacket_library,  allowed_angles: [medium_wide, side_profile]}
    5: {set: navy_sweater_library, allowed_angles: [front_speaking, three_quarter]}
    6: {set: dark_jacket_library,  allowed_angles: [front, side_profile]}

higgsfield:
  require_cost_estimate: true

budget_caps:
  explainer: 60
  short: 25

costs:
  seedance_2_0:
    cost_per_clip_usd: 1.10
    credits_per_clip: 22.5
    # Reliable (guaranteed-minimum) generated clip duration. The model's output
    # length is non-deterministic/bucketed; coverage-slot planning must size slots
    # at or below this floor so even the shortest clip fully covers its slot window.
    reliable_clip_sec: 4.0
  kling3_0:
    cost_per_clip_usd: 0.49
    credits_per_clip: 10.0
    # kling3_0 returns ~5.0s or ~6.0s clips non-deterministically; 5.0s is the
    # observed floor (2026-06-16: B005 slots came back 5.04s, B007 6.04s).
    reliable_clip_sec: 5.0
  cinematic_studio_3_0:
    cost_per_clip_usd: 1.225
    credits_per_clip: 25.0
  still_kenburns:
    cost_per_clip_usd: 0
    credits_per_clip: 0
  local_graphic:
    cost_per_clip_usd: 0
    credits_per_clip: 0

# Logical name → Higgsfield job_set_type (real model names; verified via
# `higgsfield model list --video` 2026-06-18). NOTE: there is no seedance_2_0_fast
# model — "Seedance 2.0 fast" = seedance_2_0 with --mode fast (adapter default).
# User authorized fast-mode seedance_2_0 (ample credits, max plan) for S9.
model_id_map:
  lipsync_primary: seedance_2_0
  hero_face_insert: kling3_0
  human_body_hands: kling3_0
  human_background: kling3_0
  environment_broll: kling3_0        # wan NOT authorized — kling3_0 for all b-roll
  narrative_wide_james: seedance_2_0
  experimental_lipsync: cinematic_studio_3_0

# Shot-type routing (simplified — 5 types)
shot_type_routes:
  talking_head_hero:
    model: lipsync_primary
    requires_audio: true
    preserve_baked_audio: true
    prompt_template: talking_head_hero

  talking_head_standard:
    model: lipsync_primary
    requires_audio: true
    preserve_baked_audio: true
    prompt_template: talking_head_standard

  hero_face_insert:
    model: hero_face_insert
    requires_audio: false
    preserve_baked_audio: false
    prompt_template: hero_face_insert

  broll_human:
    model: human_background
    requires_audio: false
    preserve_baked_audio: false
    prompt_template: broll_environment

  broll_environment:
    model: environment_broll
    requires_audio: false
    preserve_baked_audio: false
    prompt_template: broll_environment

# Banned models — never used
banned_models:
  - minimax_hailuo
  - seedance_2_0_fast   # not a real model (verified); kept banned to prevent use
  - seedance1_5
  - wan2_7
  - wan2_6

# Shot-type cost guide (at $0.049/credit, 2026-06-11)
# Seedance 2.0 lipsync: 22.5cr/5s = $1.10/clip — for short hero lipsync only (≤15s narration)
# Kling 3.0 voiceover:  10cr/5s  = $0.49/clip — for all voiceover/b-roll shots
# Realistic flagship cost: $70-80 total (151 voiceover shots + existing lipsync hook)

# PRODUCTION ARCHITECTURE (updated 2026-06-11):
# Rule: any segment with narration > 15s → use voiceover shots[] + audio field
# Rule: hook and CTA (≤15s) → baked_in lipsync with seedance_2_0
# Rule: never route to wan2_7 or wan2_6
# assemble.py handles: shots[] + audio field → concat visuals, overlay ElevenLabs narration

prompt_templates:
  talking_head_hero: >
    Photorealistic cinematic medium close-up of James, the same person as the reference image.
    Natural human skin texture, visible pores, slight asymmetry, realistic eyes with catchlights,
    subtle blinking, restrained expression, calm confident delivery. Shot on an 85mm portrait lens,
    soft diffused key light, gentle fill, natural shadows, documentary corporate interview style.
    Minimal head movement, no exaggerated gestures. Avoid waxy skin, plastic texture, glassy eyes,
    distorted teeth, warped lips, rubber mouth, twitchy eyelids, fake influencer look, over-smoothed face.

  talking_head_standard: >
    Photorealistic professional talking-head video of James, same identity as reference image,
    medium close-up framing, calm educational delivery, natural lip movement synchronized to
    provided audio, subtle head movement, realistic skin texture, realistic eyes, soft office
    lighting, premium business education tone. Avoid uncanny valley, waxy skin, exaggerated
    mouth shapes, fake smile, over-smoothing, distorted teeth, twitchy blinking.

  hero_face_insert: >
    Photorealistic cinematic portrait insert of James, non-speaking, thoughtful expression,
    realistic skin, natural eyes, subtle breathing, minimal motion, soft office background blur,
    85mm lens, high-end documentary look. No speech, no text, no logo.

  broll_environment: >
    Cinematic premium business b-roll: modern office, glass, warm practical lights, city ambience,
    clean architecture, slow controlled camera movement, premium documentary style, no people in
    close-up, no readable text, no fake words, no logos, no UI hallucinations.

# James segment mapping
james_segments:
  001_hook:
    shot_type: talking_head_hero
    narration: true
  002_background:
    shot_type: broll_environment
    narration: false
  003_pattern:
    shot_type: talking_head_standard
    narration: true
  004_system:
    shot_type: broll_environment
    narration: false
  005_give_back:
    shot_type: talking_head_standard
    narration: true
  006_audience:
    shot_type: broll_environment
    narration: false
  007_promise:
    shot_type: talking_head_standard
    narration: true
  008_cta:
    shot_type: talking_head_standard
    narration: true
