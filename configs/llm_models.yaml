profiles:
  sonnet_creative:
    model: claude-sonnet-4.6
    purpose: creative/reasoning-heavy tasks
    is_final_creative_authority: true
    default_for: creative
    anti_repetition_directive: "CRITICAL: Never repeat the same phrase, sentence structure, or pattern verbatim. Each sentence must advance the narrative. If you find yourself writing a similar construction to something earlier, restructure it completely."
    max_reroll_attempts: 2

  storyboard_director:
    model: claude-opus-4.8
    purpose: bulletproof storyboard authoring grounded in all bibles + source text
    is_final_creative_authority: true

  auto_utility:
    model: auto
    purpose: mechanical/low-risk tasks
    is_final_creative_authority: false
    default_for: utility

default_creative: sonnet_creative
default_utility: auto_utility

# Tasks that require creative authority (cannot use auto_utility)
creative_authority_tasks:
  - script_review
  - storyboard_generation
  - storyboard_review
  - media_prompt_compilation
  - brand_universe_review
  - audience_retention_review
  - hook_generation
  - framework_building
  - script_writing
